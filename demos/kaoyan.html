  function readSave() {

      saved = envelope;
      sound = envelope.sound === true;
      nextSeed = ((envelope.state.seed ?? config.seed) + 1) | 0;
    } catch (error) {

  function save() {

  function tone(kind = 'click') {

      if (!Audio) return;

      if (audioContext.state === 'suspended') audioContext.resume().catch(() => {});
      const frequencies = kind === 'success' ? [392, 494, 587] : kind === 'week' ? [330, 440] : [520];
      frequencies.forEach((hz, index) => {
        const oscillator = audioContext.createOscillator(), gain = audioContext.createGain();
        const start = audioContext.currentTime + index * .1;
        oscillator.type = 'sine'; oscillator.frequency.value = hz;
        gain.gain.setValueAtTime(0, start); gain.gain.linearRampToValueAtTime(.028, start + .018);
        gain.gain.exponentialRampToValueAtTime(.001, start + .16);

      overlay = engine.pendingEvent() ? {type: 'event'} : null;

  }
  function rulesHTML() {
    return `<div class="modal-top"><div><div class="eyebrow">不必先读懂全部公式</div><h2>先记住这几件小事。</h2></div>${btn('close','×','modal-close','','aria-label="关闭规则"')}</div><div class="rule-grid"><section class="rule-card"><h3>01 / 先安排，再确认</h3><p>每周 ${config.slots} 个时段，共 ${config.weeks} 周。同一行动可以重复。箭头调整顺序，× 移除。确认之前可以随时修改。</p></section><section class="rule-card"><h3>02 / 恢复也会带来收获</h3><p>学习按行动开始前的状态算收益。精力低于60、压力高于35时效率下降；先休息再学习，可能比一直学收获更多。</p></section><section class="rule-card"><h3>03 / 生活也需要预算</h3><p>冲刺每次花费 ¥25。每周生活费 ¥${config.weeklyExpense}，周末精力 ${signed(config.weeklyEnergy)}、压力 ${signed(config.weeklyStress)}。兼职可以支付同周后面的冲刺。欠款时仍能自习、休息或兼职。</p></section><section class="rule-card"><h3>04 / 总分与单科都要过线</h3><p>政治、英语满分100，数学、专业满分150。积累的成绩就是最后的考试成绩，不会临时掷骰子决定录取。</p></section><section class="rule-card"><h3>05 / 计划外，也有生活</h3><p>第2、4、6、8、10、12周结算后有一个二选一事件。每局六个，不重复。效果直接显示，钱不够的付费选项不能选择。</p></section><section class="rule-card"><h3>06 / 随时回来，接着走</h3><p>新局、确认计划和处理事件后自动保存。未确认的计划不会保存。可以在日记中导出、导入存档，换浏览器时也能继续。</p></section></div><details class="rule-formula"><summary>想看清楚：学习效率怎样计算？</summary><p>精力系数 = min(1, 0.55 + 0.0075 × 精力)<br>压力系数 = 1 − max(0, 压力 − 35) × 0.005<br>实际涨分 = 基础收益 × 精力系数 × 压力系数<br>涨分四舍五入到一位小数，成绩不超过科目满分。先计算涨分，再改变状态。</p></details><div class="modal-actions">${btn('close','知道了，试着安排一下','primary')}</div>`;
  }
  function chartHTML(items) {
    if (!items.length) return '';
    const initial=config.backgrounds[engine.state.background].scores.reduce((a,b)=>a+b,0);
    const values=[initial,...items.map(record=>engine.total(record.final))];
    const max=Math.max(engine.goal().total+20,...values)+10;
    const coords=values.map((value,i)=>[24+i*(570/Math.max(12,values.length-1)),115-(value/(max||1))*98]);
    const line=coords.map(point=>point.join(',')).join(' ');
    const targetY=115-(engine.goal().total/max)*98;
    return `<div class="chart"><svg viewBox="0 0 650 138" role="img" aria-label="总分从${initial}增长到${f(values.at(-1))}"><path d="M24 ${targetY}H594" stroke="#c6a574" stroke-dasharray="4 5" fill="none"/><text x="602" y="${targetY+3}" font-size="10" fill="#ae8b58">${engine.goal().total}</text><polygon points="${coords[0][0]},115 ${line} ${coords.at(-1)[0]},115" fill="#d8e2ca"/><polyline points="${line}" fill="none" stroke="#739365" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${coords.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="3" fill="#70905f"/><text x="${x}" y="133" fill="#93a185" text-anchor="middle" font-size="9">${i===0?'开局':i+'周'}</text>`).join('')}</svg></div>`;
  }
  function diaryHTML() {
    const items=records();
    return `<div class="modal-top"><div><div class="eyebrow">那些认真生活过的日子</div><h2>我的备考日记</h2></div>${btn('close','×','modal-close','','aria-label="关闭日记"')}</div>${items.length?chartHTML(items):'<p class="empty-diary">第一页还空着。<br>从确认这一周的计划开始吧。</p>'}<div class="diary-list">${[...items].reverse().map(record=>`<article class="diary-entry"><h3><span>第 ${record.week} 周</span><span>${f(engine.total(record.final))} 分 · ¥${record.final.money}</span></h3><p>${record.plan.map(id=>esc(engine.action(id).name)).join(' → ')}</p><p>${config.subjectNames.map((name,i)=>`${name} ${signed(ExamEngine.rounded(record.final.scores[i]-record.before.scores[i]))}`).join(' · ')}</p>${record.event?`<p>生活插曲 / ${esc(record.event.title)}<br>你的选择：${esc(record.event.text)}（${esc(record.event.description)}）</p>`:''}</article>`).join('')}</div><div class="import-zone"><p>${storageAvailable?'已自动保存本机进度。导出一份备份，也可以在另一个浏览器继续。':'本地保存不可用，请导出存档保留本轮进度。'}未确认的计划不在存档中。</p>${btn('export','导出存档','secondary')}${btn('import','导入存档','secondary')}${btn('restart','重新开始','text-btn')}</div>`;
  }
  function weekHTML() {
    const result=overlay.result, currentWeek=result.before.week;
    return `<div class="eyebrow">第 ${currentWeek} 周 · 小小的收获</div><h2 style="margin-top:9px">又认真地，过了一周。</h2><div class="week-result"><div><span>本周总分</span><strong style="display:block">${f(engine.total(result.after))}</strong></div><span>积累了 <b style="font-size:22px;font-weight:400">${signed(ExamEngine.rounded(engine.total(result.after)-engine.total(result.before)))}</b> 分</span></div><div class="result-actions">${result.steps.map((step,i)=>`<div class="result-step"><span>0${i+1}</span><div><strong>${esc(step.name)}</strong><small>${step.subject>=0?`学习效率 ${f(ExamEngine.rounded(step.efficiency*100))}%`:step.name.includes('兼职')?'把生活安顿好。':'暂停一下，是为了继续向前。'}</small></div><b>${step.subject>=0?'+'+f(step.gain):'✓'}</b></div>`).join('')}</div><p class="result-note">生活费已记账 ¥${config.weeklyExpense}。周末精力 ${f(result.after.energy)}，压力 ${f(result.after.stress)}，剩余预算 ¥${result.after.money}。${result.after.money<0?'免费自习和兼职仍可继续安排。':''}</p><div class="modal-actions">${btn('next',engine.pendingEvent()?'这一周，还有一件小事 →':engine.state.finished?'带着这些，走进考场 →':'收好这一页，继续向前 →','primary')}</div>`;
  }
  function eventHTML() {
    const event=engine.pendingEvent();
    const symbols=['信','风','书','余','伴','望','灯','愿'];
    return `<div class="event-label">第 ${engine.state.week} 周 / 计划之外的生活</div><div class="event-illustration" aria-hidden="true">${symbols[engine.state.eventIndex] || '记'}</div><h2>${esc(event.title)}</h2><p class="event-body">${esc(event.body)}</p><div class="event-choices">${event.options.map((option,i)=>btn('event',`<strong>${esc(option.text)} <span aria-hidden="true" style="float:right;color:#a8b298">↗</span></strong><p>${esc(option.description)}</p>${!engine.canChoose(i)?'<small>预算不足，可以选择另一种安排。</small>':''}`,'event-choice',i,engine.canChoose(i)?'':'disabled')).join('')}</div>`;
  }
  function restartHTML() {
    return `<div class="modal-top"><h2>再写一种可能？</h2></div><p class="muted">${overlay.fromStart?'开始新的十二周，会替换本机上一次的进度。':'会先回到起点，让你重新选择背景与目标。确认开始新局后，才会替换本机旧进度。'}</p><p class="muted" style="font-size:12px;margin-top:10px">想保留这一轮，可以先去日记里导出存档。</p><div class="modal-actions">${btn('cancel','先继续这一轮','secondary')}${btn('confirm-restart',overlay.fromStart?'确认开始新局':'回到起点','primary')}</div>`;
  }
  function renderOverlay() {
    if (!overlay) { overlayRoot.innerHTML=''; app.inert=false; document.body.style.overflow=''; return; }
    let html='',wide=false;
    if(overlay.type==='rules'){html=rulesHTML();wide=true;}
    else if(overlay.type==='diary'){html=diaryHTML();wide=true;}
    else if(overlay.type==='week')html=weekHTML();
    else if(overlay.type==='event')html=eventHTML();
    else if(overlay.type==='restart')html=restartHTML();
    else if(overlay.type==='import-confirm')html=`<div class="modal-top"><h2>继续这份备考进度？</h2></div><p class="muted">${esc(config.backgrounds[overlay.data.state.background].name)} · ${esc(config.goals[overlay.data.state.goal].name)}<br>${overlay.data.state.finished?'已完成十二周':'第 '+overlay.data.state.week+' 周'}，总分 ${f(overlay.data.state.scores.reduce((a,b)=>a+b,0))}。导入后会替换本机已保存的进度。</p><div class="modal-actions">${btn('cancel','保留当前进度','secondary')}${btn('confirm-import','确认导入','primary')}</div>`;
    overlayRoot.innerHTML=`<div class="overlay-backdrop"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${({rules:'规则说明',diary:'备考日记',week:'本周结算',event:'生活事件',restart:'重新开始确认','import-confirm':'导入确认'})[overlay.type]}">${html}</section></div>`;
    app.inert=true;document.body.style.overflow='hidden';
    const first=overlayRoot.querySelector('button:not(:disabled)'); if(first)first.focus({preventScroll:true});
  }
  function render() {
    const focused=document.activeElement;
    const focusAction=focused?.dataset?.action, focusId=focused?.dataset?.id;
    app.innerHTML=screen==='intro'?introHTML():screen==='ending'?endingHTML():playHTML();
    renderOverlay();
    if(!overlay&&focusAction){
      const candidate=[...app.querySelectorAll('[data-action]')].find(el=>el.dataset.action===focusAction&&el.dataset.id===focusId&&!el.disabled);
      candidate?.focus({preventScroll:true});
    }
  }
  function openOverlay(value) { lastFocus=document.activeElement;overlay=value;renderOverlay(); }
  function closeOverlay() { overlay=null;renderOverlay();lastFocus?.isConnected&&lastFocus.focus({preventScroll:true}); }
  function afterProgress() {
    if(engine.pendingEvent()){overlay={type:'event'};screen='play';}
    else {overlay=null;screen=engine.state.finished?'ending':'play';}
    render();
    if(screen==='ending'){window.scrollTo({top:0,behavior:'instant'});if(engine.isAdmitted()){tone('success');confetti();}}
  }
  function confetti() {
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    const layer=document.createElement('div');layer.className='confetti';layer.setAttribute('aria-hidden','true');
    layer.innerHTML=Array.from({length:32},(_,i)=>`<i style="left:${(i*37)%100}%;animation-delay:${(i%7)*.09}s;transform:rotate(${i*31}deg)"></i>`).join('');
    document.body.appendChild(layer);setTimeout(()=>layer.remove(),3800);
  }
  function exportSave() {
    if(!engine){notify('先开始这一轮备考，就能导出进度了。');return;}
    const text=JSON.stringify({version:1,state:engine.state,sound},null,2);
    const url=URL.createObjectURL(new Blob([text],{type:'application/json'}));
    const a=document.createElement('a');a.href=url;a.download=`中国式考研_第${Math.min(engine.state.week,config.weeks)}周存档.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);
    notify('存档已导出，可以带到另一个浏览器继续。');
  }
  document.addEventListener('click',event=>{
    const button=event.target.closest('button[data-action]');
    if(!button||button.disabled)return;
    const action=button.dataset.action,id=button.dataset.id,index=Number(id);
    if(overlay&&!overlayRoot.contains(button))return;
    if(action!=='sound')tone();
    switch(action){
      case 'background':selectedBackground=index;render();break;
      case 'goal':selectedGoal=index;render();break;
      case 'start':if(saved)openOverlay({type:'restart',fromStart:true});else startGame();break;
      case 'continue':continueGame();break;
      case 'sound':sound=!sound;tone('week');if(engine)save();render();break;
      case 'tab':tab=id;render();break;
      case 'add':if(!engine||engine.pendingEvent()||engine.state.finished||plan.length>=config.slots)return;plan.push(id);render();notify(`已安排「${engine.action(id).name}」 · ${plan.length}/${config.slots} 时段`);break;
      case 'remove':plan.splice(index,1);render();break;
      case 'up':if(index>0){[plan[index-1],plan[index]]=[plan[index],plan[index-1]];render();}break;
      case 'down':if(index<plan.length-1){[plan[index+1],plan[index]]=[plan[index],plan[index+1]];render();}break;
      case 'commit':{
        if(plan.length!==config.slots)return;
        const result=engine.commit(plan);
        if(!result.ok){notify(result.error);return;}
        plan=[];save();overlay={type:'week',result};screen=engine.state.finished?'ending':'play';render();tone('week');break;
      }
      case 'next':afterProgress();break;
      case 'event':{
        if(!engine||!engine.pendingEvent())return;
        const eventTitle=engine.pendingEvent().options[index]?.text;
        const result=engine.chooseEvent(index);
        if(!result.ok){notify(result.error);return;}
        save();afterProgress();notify(`记下了：${eventTitle}`);break;
      }
      case 'rules':openOverlay({type:'rules'});break;
      case 'diary':if(engine)openOverlay({type:'diary'});break;
      case 'close':case 'cancel':closeOverlay();break;
      case 'restart':openOverlay({type:'restart',fromStart:false});break;
      case 'confirm-restart':{
        const immediate=overlay.fromStart;overlay=null;
        if(immediate)startGame();else{screen='intro';plan=[];render();window.scrollTo({top:0,behavior:'instant'});}break;
      }
      case 'export':exportSave();break;
      case 'import':document.getElementById('import-file').click();break;
      case 'confirm-import':{
        const data=overlay.data;
        engine=new ExamEngine(config,data.state);sound=data.sound===true;save();nextSeed=(engine.state.seed+1)|0;continueGame();notify('存档已导入。接着写下一页吧。');break;
      }
    }
  });
  document.addEventListener('keydown',event=>{
    if(!overlay)return;
    if(event.key==='Escape'&&['rules','diary','restart','import-confirm'].includes(overlay.type)){event.preventDefault();closeOverlay();return;}
    if(event.key==='Tab'){
      const elements=[...overlayRoot.querySelectorAll('button:not(:disabled),summary,input')].filter(el=>el.getClientRects().length);
      if(!elements.length)return;
      const first=elements[0],last=elements.at(-1);
      if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
      else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
    }
  });
  document.getElementById('import-file').addEventListener('change',async event=>{
    const file=event.target.files[0];event.target.value='';if(!file)return;
    if(file.size>2_000_000){notify('存档文件过大，请选择本游戏导出的 JSON。');return;}
    try{
      const data=JSON.parse(await file.text());
      if(data.version!==1||!ExamEngine.validateState(config,data.state).valid)throw new Error('invalid');
      openOverlay({type:'import-confirm',data});
    }catch(_){notify('这不是可用的备考存档，当前进度已保留。');}
  });
  window.__examQA=Object.freeze({snapshot:()=>clone({state:engine?.state||null,plan,records:records(),screen,overlay:overlay?.type||null,storageAvailable,savedState:saved?.state||null})});
  readSave();render();
})();
</script>
</body>
</html>
