<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#26315f">
  <title>团子清洁队</title>
  <style>:root{
  --ink:#26315f;
  --sky:#73d7e8;
  --berry:#f47f9e;
  --lemon:#ffd45f;
  --mint:#79cf9a;
  --paper:#fffdf2;
  --cloud:#f7fbff;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#b9e7ef;color:var(--ink);font-family:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC",sans-serif;user-select:none}
body{display:grid;place-items:center}
button{font:inherit;color:inherit}
#stage{position:relative;width:min(100vw,177.7778vh);height:min(100vh,56.25vw);margin:auto;overflow:hidden;background:#9de3ed;box-shadow:0 16px 60px #39737a55;isolation:isolate}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#game:active{cursor:grabbing}
#hud{position:absolute;z-index:5;left:24px;right:24px;top:18px;display:grid;grid-template-columns:240px minmax(220px,440px) 240px;align-items:center;justify-content:space-between;gap:24px;pointer-events:none}
.brand{display:flex;align-items:center;gap:10px;font-size:19px;text-shadow:0 2px #fff9}
.brand-mark{display:inline-block;color:var(--berry);font-size:12px;letter-spacing:-2px;transform:rotate(-7deg)}
.progress-wrap{padding:10px 15px 12px;border-radius:18px;background:#fffdf2eb;box-shadow:0 5px 0 #54769c33,0 8px 26px #426e7850}
.progress-copy{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700}
.progress-copy b{font-size:14px;color:#ef6d91}
.progress{height:9px;margin-top:7px;overflow:hidden;border-radius:12px;background:#d8e8e4}
.progress i{display:block;width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--mint),#b5db62,var(--lemon));transition:width .18s ease}
.run-stats{display:flex;justify-content:flex-end;align-items:center;gap:9px}
.run-stats>span,.run-stats button{height:42px;display:flex;align-items:center;justify-content:center;border:0;border-radius:15px;background:#fffdf2eb;box-shadow:0 5px 0 #54769c33,0 8px 22px #426e7844}
.coin{min-width:82px;gap:7px;padding:0 14px}.coin i{display:grid;place-items:center;width:23px;height:23px;border-radius:50%;background:var(--lemon);font-style:normal;font-weight:900}.coin b{font-size:17px}.clock{min-width:66px;padding:0 13px;font-variant-numeric:tabular-nums}.clock.danger{color:#fff;background:var(--berry)}
#sound{width:42px;pointer-events:auto;cursor:pointer;font-size:20px;font-weight:900}
#sound.off{opacity:.55;text-decoration:line-through}
#combo{position:absolute;z-index:4;left:28px;top:105px;display:flex;align-items:baseline;gap:7px;opacity:0;transform:translateY(-8px) rotate(-4deg);transition:.16s;color:#fff;text-shadow:0 3px 0 #db6384,0 5px 12px #29345b66;pointer-events:none}
#combo.show{opacity:1;transform:translateY(0) rotate(-4deg)}
#combo b{font-size:46px;line-height:1;font-family:"Arial Rounded MT Bold","Microsoft YaHei",sans-serif}
#combo span{font-size:15px;font-weight:900}
#prompt{position:absolute;z-index:5;left:50%;bottom:56px;transform:translate(-50%,10px);padding:10px 18px;border-radius:20px;background:var(--ink);color:#fff;opacity:0;transition:.2s;pointer-events:none;font-size:13px;font-weight:700;box-shadow:0 6px 0 #121a3c44}
#prompt.show{opacity:1;transform:translate(-50%,0)}
#controls{position:absolute;z-index:4;right:22px;bottom:15px;padding:7px 12px;border-radius:13px;background:#fffbe8b8;font-size:11px;font-weight:700;color:#374267aa;pointer-events:none}
.screen{position:absolute;z-index:12;inset:0;display:none;place-items:center;padding:28px;background:#26315f4a;backdrop-filter:blur(7px)}
.screen.show{display:grid}
.start-card,.end-card,.upgrade-panel{position:relative;width:min(750px,92vw);padding:35px 42px 30px;border:4px solid var(--ink);border-radius:35px;background:var(--paper);box-shadow:0 13px 0 var(--ink),0 28px 70px #26315f66;text-align:center}
.start-card:before,.end-card:before{content:"";position:absolute;inset:8px;border:2px dashed #e7b9c5;border-radius:25px;pointer-events:none}
.mascot{position:absolute;left:55px;top:-66px;width:118px;height:104px;border:4px solid var(--ink);border-radius:56% 44% 48% 52%;background:var(--berry);box-shadow:0 8px 0 #26315f33;transform:rotate(-8deg)}
.mascot:before,.mascot:after{content:"";position:absolute;top:-15px;width:29px;height:42px;border:4px solid var(--ink);background:var(--berry);z-index:-1}.mascot:before{left:16px;border-radius:70% 30% 0 0;transform:rotate(-16deg)}.mascot:after{right:16px;border-radius:30% 70% 0 0;transform:rotate(16deg)}
.mascot b{position:absolute;inset:0;display:grid;place-items:center;font-size:25px}.mascot i{position:absolute;width:16px;height:8px;left:16px;top:59px;border-radius:50%;background:#f9b6c8}.mascot span{position:absolute;width:16px;height:8px;right:16px;top:59px;border-radius:50%;background:#f9b6c8}
.title-lockup p,.upgrade-panel>p,.end-card>p{margin:0 0 6px;font-size:13px;font-weight:800;color:#7780a0}
.title-lockup h1{margin:0;font-size:60px;line-height:1;letter-spacing:-5px;color:var(--ink);text-shadow:3px 4px 0 var(--lemon)}
.title-lockup h2{margin:12px 0 24px;font-size:17px;font-weight:700;color:#e3678a}
.how{display:flex;align-items:center;justify-content:center;gap:15px;margin:0 auto 24px;padding:16px 20px;border-radius:22px;background:#e9f8f3}
.how div{min-width:125px}.how b,.how span{display:block}.how b{margin-bottom:5px;font-size:16px}.how span{font-size:12px;line-height:1.55;color:#687293}.how i{font-style:normal;font-size:34px;color:#75b8b0}
.primary{position:relative;min-width:220px;padding:14px 28px;border:3px solid var(--ink);border-radius:18px;background:var(--lemon);font-weight:900;font-size:18px;box-shadow:0 6px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s}
.primary:hover{transform:translateY(-2px);box-shadow:0 8px 0 var(--ink)}.primary:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.start-card small{display:block;margin-top:18px;color:#8991aa;font-size:11px}
.upgrade-panel{width:min(1100px,96vw);padding-top:30px}
.upgrade-panel h2{margin:0 0 22px;font-size:32px}
.upgrade-choices{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.upgrade-choice{min-height:186px;padding:20px 16px 18px;border:3px solid var(--ink);border-radius:24px;background:#fff;box-shadow:0 7px 0 #26315f;cursor:pointer;transition:transform .12s,background .12s}
.upgrade-choice:nth-child(2){background:#effaf3}.upgrade-choice:nth-child(3){background:#fff9dc}.upgrade-choice:nth-child(4){background:#eef8ff}.upgrade-choice:hover{transform:translateY(-5px) rotate(-1deg);background:#fff5b7}.upgrade-choice:focus-visible,.primary:focus-visible,#sound:focus-visible{outline:4px solid #fff;outline-offset:4px}
.upgrade-choice i{display:grid;place-items:center;width:62px;height:62px;margin:0 auto 12px;border:3px solid var(--ink);border-radius:22px;background:var(--sky);font-style:normal;font-size:30px}.upgrade-choice:nth-child(2) i{background:var(--berry)}.upgrade-choice:nth-child(3) i{background:var(--lemon)}.upgrade-choice:nth-child(4) i{background:var(--mint)}
.upgrade-choice b,.upgrade-choice span{display:block}.upgrade-choice b{font-size:18px}.upgrade-choice span{margin-top:8px;color:#687293;font-size:12px;line-height:1.5}
.end-card{width:min(690px,92vw);padding-top:45px}.end-card h2{margin:8px 0 24px;font-size:28px}.end-score{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:26px}.end-score span{padding:13px 8px;border-radius:18px;background:#e9f8f3;font-size:12px;color:#7780a0}.end-score b{display:block;margin-top:5px;font-size:22px;color:var(--ink)}
#stamp{position:absolute;right:35px;top:-35px;display:grid;place-items:center;width:90px;height:90px;border:6px double #ec6f91;border-radius:50%;color:#ec6f91;font-size:22px;font-weight:900;transform:rotate(12deg);background:#fffdf2}
@media(max-width:760px){#hud{left:10px;right:10px;top:10px;grid-template-columns:1fr 1.4fr 1fr;gap:8px}.brand b{display:none}.progress-wrap{padding:8px 10px 9px}.run-stats{gap:5px}.run-stats>span,.run-stats button{height:34px;border-radius:11px}.coin{min-width:62px;padding:0 8px}.coin i{width:19px;height:19px}.clock{min-width:53px;padding:0 7px}#sound{width:34px}.start-card{padding:28px 18px 22px}.mascot{display:none}.title-lockup h1{font-size:42px}.how{gap:5px;padding:12px 5px}.how div{min-width:0;flex:1}.how i{font-size:22px}.upgrade-panel{padding:18px 12px}.upgrade-panel h2{margin-bottom:12px;font-size:24px}.upgrade-choices{grid-template-columns:repeat(2,1fr);gap:8px}.upgrade-choice{min-height:120px;padding:10px 8px}.upgrade-choice i{width:40px;height:40px;margin-bottom:7px;font-size:20px}.upgrade-choice b{font-size:13px}.upgrade-choice span{margin-top:4px;font-size:9px}#controls{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <main id="stage" aria-label="团子清洁队游戏区域">
    <canvas id="game" width="1280" height="720" aria-label="雨后街区清洁画面"></canvas>

    <header id="hud">
      <section class="brand"><span class="brand-mark">●●●</span><b>团子清洁队</b></section>
      <section class="progress-wrap">
        <div class="progress-copy"><span>街区清爽度</span><b id="cleanText">0%</b></div>
        <div class="progress"><i id="cleanBar"></i></div>
      </section>
      <section class="run-stats">
        <span class="coin"><i>¥</i><b id="coins">0</b></span>
        <span class="clock"><b id="clock">2:00</b></span>
        <button id="sound" aria-label="切换声音">♪</button>
      </section>
    </header>

    <div id="combo" aria-live="polite"><b id="comboNum">2</b><span>连送</span></div>
    <div id="prompt">团子装满啦，回到餐车交付！</div>

    <section id="startScreen" class="screen show">
      <div class="start-card">
        <div class="mascot" aria-hidden="true"><i></i><b>˙ᴗ˙</b><span></span></div>
        <div class="title-lockup">
          <p>雨停了，甜点街却一团糟</p>
          <h1>团子清洁队</h1>
          <h2>吸走、合成、送回餐车</h2>
        </div>
        <div class="how">
          <div><b>移动</b><span>点击 / 拖动<br>或 WASD</span></div>
          <i>›</i>
          <div><b>靠近</b><span>自动吸走<br>散落团子</span></div>
          <i>›</i>
          <div><b>送回</b><span>靠近餐车<br>自动结算</span></div>
        </div>
        <button id="startButton" class="primary">开始清洁</button>
        <small>不用攻击，不会失败 · 两分钟一局</small>
      </div>
    </section>

    <section id="upgradeScreen" class="screen" aria-live="polite">
      <div class="upgrade-panel">
        <p>队长，换个新工具</p>
        <h2>选一个，马上生效</h2>
        <div id="upgradeChoices" class="upgrade-choices"></div>
      </div>
    </section>

    <section id="endScreen" class="screen">
      <div class="end-card">
        <div id="stamp">清爽</div>
        <p>本轮收摊</p>
        <h2 id="endTitle">甜点街重新亮起来了</h2>
        <div class="end-score"><span>总金币<b id="finalCoins">0</b></span><span>时间奖励<b id="timeBonus">+0</b></span><span>清爽度<b id="finalClean">0%</b></span><span>最佳金币<b id="bestScore">0</b></span></div>
        <button id="restartButton" class="primary">再清一条街</button>
      </div>
    </section>

    <footer id="controls">移动：WASD / 方向键 / 点击或拖动　　冲刺：空格</footer>
  </main>
  <script>(() => {
  'use strict';

  const VIEW = { w: 1280, h: 720 };
  const WORLD = { w: 1880, h: 1160 };
  const COLORS = ['#f47f9e', '#73d7e8', '#ffd45f'];
  const MAX_DANGO_LEVEL = 7;
  const UPGRADE_THRESHOLDS = [18, 38, 60, 84, 108];
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const ui = {
    cleanText: document.getElementById('cleanText'), cleanBar: document.getElementById('cleanBar'),
    coins: document.getElementById('coins'), clock: document.getElementById('clock'), sound: document.getElementById('sound'),
    combo: document.getElementById('combo'), comboNum: document.getElementById('comboNum'), prompt: document.getElementById('prompt'),
    start: document.getElementById('startScreen'), upgrade: document.getElementById('upgradeScreen'),
    choices: document.getElementById('upgradeChoices'), end: document.getElementById('endScreen'),
    finalCoins: document.getElementById('finalCoins'), timeBonus: document.getElementById('timeBonus'), finalClean: document.getElementById('finalClean'),
    best: document.getElementById('bestScore'), endTitle: document.getElementById('endTitle'), stamp: document.getElementById('stamp')
  };

  const input = { keys: new Set(), pointer: false, target: null };
  let state = null;
  let last = performance.now();
  let audioOn = true;
  let audio = null;

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

  function createState() {
    const patches = [
      { x: 340, y: 280, r: 180 }, { x: 930, y: 245, r: 165 }, { x: 1510, y: 310, r: 190 },
      { x: 420, y: 860, r: 185 }, { x: 1030, y: 820, r: 200 }, { x: 1580, y: 850, r: 170 }
    ].map((p, i) => ({ ...p, i, initial: 20, remain: 20 }));
    const motes = [];
    patches.forEach((patch, patchIndex) => {
      for (let i = 0; i < patch.initial; i++) {
        const a = rand(0, Math.PI * 2), rr = Math.sqrt(Math.random()) * patch.r;
        motes.push({
          x: patch.x + Math.cos(a) * rr, y: patch.y + Math.sin(a) * rr,
          vx: 0, vy: 0, type: Math.floor(Math.random() * 3), level: 1,
          size: rand(13, 18), phase: rand(0, 8), patch: patchIndex
        });
      }
    });
    return {
      mode: 'title', time: 120, coins: 0, cleaned: 0, total: motes.length,
      combo: 0, comboTimer: 0, nextUpgrade: UPGRADE_THRESHOLDS[0], upgradeCount: 0, takenUpgrades: [],
      camera: { x: WORLD.w / 2 - VIEW.w / 2, y: WORLD.h / 2 - VIEW.h / 2 },
      cart: { x: WORLD.w / 2, y: WORLD.h / 2, deliveryRadius: 122 },
      player: { x: WORLD.w / 2, y: WORLD.h / 2 + 145, r: 24, speed: 245, suction: 155, pullPower: 1, capacity: 7, value: 1, highLevelBonus: 1, comboWindow: 8, mergeNeed: 3, mergeCoin: 0, emptyBoost: 1, dash: 0, dashCd: 0, rainbowEvery: 0, pickups: 0, cargo: [], facing: 1, bob: 0 },
      patches, motes, particles: [], texts: [], confetti: [],
      decorations: makeDecorations()
    };
  }

  function makeDecorations() {
    const items = [];
    for (let i = 0; i < 34; i++) {
      const edge = Math.random() < .5;
      items.push({ x: edge ? rand(80, WORLD.w - 80) : (Math.random() < .5 ? rand(80, 180) : rand(WORLD.w - 180, WORLD.w - 80)), y: edge ? (Math.random() < .5 ? rand(80, 150) : rand(WORLD.h - 150, WORLD.h - 80)) : rand(80, WORLD.h - 80), kind: Math.random() < .58 ? 'tree' : 'lamp', s: rand(.8, 1.2) });
    }
    return items;
  }

  function startGame() {
    state = createState();
    state.mode = 'play';
    ui.start.classList.remove('show');
    ui.end.classList.remove('show');
    ensureAudio();
    tone(440, .06, 'sine', .035);
    last = performance.now();
  }

  function ensureAudio() {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
  }

  function tone(freq, duration = .08, type = 'sine', volume = .035, delay = 0) {
    if (!audioOn || !audio) return;
    const osc = audio.createOscillator(), gain = audio.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, audio.currentTime + delay);
    gain.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + delay + duration);
    osc.connect(gain).connect(audio.destination); osc.start(audio.currentTime + delay); osc.stop(audio.currentTime + delay + duration);
  }

  function burst(x, y, color, amount = 10, force = 120) {
    for (let i = 0; i < amount; i++) {
      const a = rand(0, Math.PI * 2), v = rand(force * .4, force);
      state.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(.35, .75), max: .75, color, size: rand(3, 8) });
    }
  }

  function floatText(x, y, text, color = '#26315f', size = 18) {
    state.texts.push({ x, y, text, color, size, life: 1, max: 1 });
  }

  function update(dt) {
    if (!state || state.mode !== 'play') return;
    const p = state.player;
    state.time = Math.max(0, state.time - dt);
    p.dashCd = Math.max(0, p.dashCd - dt);
    p.dash = Math.max(0, p.dash - dt);
    p.bob += dt * 9;

    let dx = 0, dy = 0;
    if (input.keys.has('a') || input.keys.has('arrowleft')) dx--;
    if (input.keys.has('d') || input.keys.has('arrowright')) dx++;
    if (input.keys.has('w') || input.keys.has('arrowup')) dy--;
    if (input.keys.has('s') || input.keys.has('arrowdown')) dy++;
    if (input.target) {
      const tx = input.target.x - p.x, ty = input.target.y - p.y, d = Math.hypot(tx, ty);
      if (d > 18) { dx += tx / d; dy += ty / d; }
      else input.target = null;
    }
    const len = Math.hypot(dx, dy);
    if (len > 0) {
      dx /= len; dy /= len; p.facing = dx < -.05 ? -1 : dx > .05 ? 1 : p.facing;
      const speed = p.speed * (p.cargo.length === 0 ? p.emptyBoost : 1) * (p.dash > 0 ? 2.15 : 1);
      p.x = clamp(p.x + dx * speed * dt, 45, WORLD.w - 45);
      p.y = clamp(p.y + dy * speed * dt, 55, WORLD.h - 45);
    }

    updateMotes(dt);
    updateCargo(dt);
    updateParticles(dt);
    updateDelivery(dt);

    state.camera.x = lerp(state.camera.x, clamp(p.x - VIEW.w / 2, 0, WORLD.w - VIEW.w), 1 - Math.pow(.001, dt));
    state.camera.y = lerp(state.camera.y, clamp(p.y - VIEW.h / 2, 0, WORLD.h - VIEW.h), 1 - Math.pow(.001, dt));
    state.comboTimer = Math.max(0, state.comboTimer - dt);
    if (state.comboTimer <= 0) state.combo = 0;

    if (state.cleaned >= state.nextUpgrade && state.upgradeCount < UPGRADE_THRESHOLDS.length) showUpgrade();
    if (state.time <= 0 || state.cleaned >= state.total) endGame();
  }

  function updateMotes(dt) {
    const p = state.player;
    for (let i = state.motes.length - 1; i >= 0; i--) {
      const m = state.motes[i]; m.phase += dt * 3;
      const d = dist(m, p);
      if (d < p.suction) {
        const pull = (420 + (p.suction - d) * 5) * p.pullPower;
        m.vx += (p.x - m.x) / Math.max(1, d) * pull * dt;
        m.vy += (p.y - m.y) / Math.max(1, d) * pull * dt;
      }
      m.vx *= Math.pow(.025, dt); m.vy *= Math.pow(.025, dt);
      m.x += m.vx * dt; m.y += m.vy * dt;
      if (d < p.r + m.size + 4 && p.cargo.length < p.capacity) collectMote(i, m);
    }
  }

  function collectMote(index, mote) {
    const p = state.player;
    state.motes.splice(index, 1);
    state.patches[mote.patch].remain = Math.max(0, state.patches[mote.patch].remain - 1);
    state.cleaned++; p.pickups++;
    let type = mote.type;
    if (p.rainbowEvery && p.pickups % p.rainbowEvery === 0) type = p.cargo.length ? p.cargo[p.cargo.length - 1].type : type;
    p.cargo.push({ x: p.x, y: p.y, vx: 0, vy: 0, type, level: 1, wobble: rand(0, 9) });
    burst(mote.x, mote.y, COLORS[type], 6, 80);
    tone(550 + type * 90, .045, 'sine', .022);
    autoMerge();
  }

  function autoMerge() {
    const p = state.player, cargo = p.cargo, needed = p.mergeNeed;
    let merged = true;
    while (merged) {
      merged = false;
      for (let level = 1; level < MAX_DANGO_LEVEL && !merged; level++) {
        for (let type = 0; type < 3 && !merged; type++) {
          const ids = [];
          cargo.forEach((c, i) => { if (c.type === type && c.level === level) ids.push(i); });
          if (ids.length >= needed) {
            const chosen = ids.slice(-needed), anchor = cargo[chosen[chosen.length - 1]];
            for (let j = chosen.length - 1; j >= 0; j--) cargo.splice(chosen[j], 1);
            cargo.push({ x: anchor.x, y: anchor.y, vx: 0, vy: 0, type, level: level + 1, wobble: rand(0, 9) });
            burst(anchor.x, anchor.y, COLORS[type], 18, 185);
            if (p.mergeCoin) state.coins += p.mergeCoin;
            floatText(anchor.x, anchor.y - 35, p.mergeCoin ? `合成 +${p.mergeCoin}` : '噗！合成', COLORS[type], 19);
            tone(420 + level * 160, .08, 'triangle', .04);
            tone(650 + level * 180, .12, 'sine', .025, .06);
            merged = true;
          }
        }
      }
    }
  }

  function updateCargo(dt) {
    const cargo = state.player.cargo, p = state.player;
    for (let i = 0; i < cargo.length; i++) {
      const c = cargo[i], lead = i === 0 ? p : cargo[i - 1];
      const dx = lead.x - c.x, dy = lead.y - c.y, d = Math.max(.1, Math.hypot(dx, dy));
      const gap = 38 + Math.min(c.level, 4) * 5 + Math.max(0, c.level - 4) * 2;
      if (d > gap) {
        const pull = (d - gap) * 18;
        c.vx += dx / d * pull * dt; c.vy += dy / d * pull * dt;
      }
      c.vx *= Math.pow(.015, dt); c.vy *= Math.pow(.015, dt);
      c.x += c.vx * dt; c.y += c.vy * dt; c.wobble += dt * 5;
    }
  }

  function updateDelivery() {
    const p = state.player, cart = state.cart;
    const near = dist(p, cart) < cart.deliveryRadius;
    if (near && p.cargo.length) settleCargo();
  }

  function settleCargo() {
    const p = state.player, cart = state.cart;
    if (!p.cargo.length) return 0;
    let value = 0;
    p.cargo.forEach(c => { value += cargoValue(c.level) * (c.level >= 2 ? p.highLevelBonus : 1); burst(c.x, c.y, COLORS[c.type], 8 + c.level * 2, 150); });
    value = Math.round(value * p.value * (1 + Math.min(5, state.combo) * .12));
    state.coins += value; state.combo++; state.comboTimer = p.comboWindow;
    ui.comboNum.textContent = state.combo;
    ui.combo.classList.toggle('show', state.combo >= 2);
    floatText(cart.x, cart.y - 90, `收入 +${value}`, '#f25f87', 24);
    p.cargo.length = 0;
    tone(523, .07, 'triangle', .04); tone(659, .07, 'triangle', .035, .07); tone(784, .12, 'triangle', .03, .14);
    return value;
  }

  function cargoValue(level) {
    return (Math.pow(3, level) - 1) / 2;
  }

  function updateParticles(dt) {
    state.particles.forEach(p => { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 55 * dt; p.vx *= Math.pow(.2, dt); });
    state.particles = state.particles.filter(p => p.life > 0);
    state.texts.forEach(t => { t.life -= dt; t.y -= 34 * dt; });
    state.texts = state.texts.filter(t => t.life > 0);
  }

  const upgrades = [
    { id: 'magnet', icon: '🧲', name: '大号磁铁', desc: '吸取范围扩大 32%', apply: p => p.suction *= 1.32 },
    { id: 'skates', icon: '🛼', name: '果冻轮滑', desc: '移动速度提高 22%', apply: p => p.speed *= 1.22 },
    { id: 'basket', icon: '🧺', name: '伸缩篮筐', desc: '可以多带 4 只团子', apply: p => p.capacity += 4 },
    { id: 'sign', icon: '🍓', name: '草莓招牌', desc: '每次交付收入提高 30%', apply: p => p.value *= 1.3 },
    { id: 'rainbow', icon: '🌈', name: '彩虹糖纸', desc: '每第 5 只团子自动变成同色', apply: p => p.rainbowEvery = 5 },
    { id: 'dash', icon: '⚡', name: '汽水冲刺', desc: '空格冲刺，冷却缩短为 2 秒', apply: p => { p.dashCd = 0; p.hasDash = true; } },
    { id: 'vacuum', icon: '🌀', name: '双倍吸管', desc: '团子飞向你的速度提高 55%', apply: p => p.pullPower *= 1.55 },
    { id: 'cart', icon: '🚚', name: '移动餐车', desc: '交付范围扩大 55 米', apply: (p, game) => game.cart.deliveryRadius += 55 },
    { id: 'receipt', icon: '🧾', name: '保温小票', desc: '连送保留时间增加 5 秒', apply: p => p.comboWindow += 5 },
    { id: 'clock', icon: '⏰', name: '加班闹钟', desc: '本局立刻增加 18 秒', apply: (p, game) => game.time += 18 },
    { id: 'skewer', icon: '🍡', name: '金色竹签', desc: '2 级以上团子价值提高 40%', apply: p => p.highLevelBonus *= 1.4 },
    { id: 'packer', icon: '🎁', name: '二合打包机', desc: '两只同级同色团子即可合成', apply: p => p.mergeNeed = 2 },
    { id: 'sticker', icon: '⭐', name: '合成贴纸', desc: '每次合成立刻获得 3 金币', apply: p => p.mergeCoin = 3 },
    { id: 'sneakers', icon: '👟', name: '空篮快跑', desc: '没有携带团子时速度提高 35%', apply: p => p.emptyBoost = 1.35 }
  ];

  function showUpgrade() {
    state.mode = 'upgrade'; state.upgradeCount++;
    state.nextUpgrade = UPGRADE_THRESHOLDS[state.upgradeCount] || 999;
    const pool = upgrades.filter(u => !state.takenUpgrades.includes(u.id)).sort(() => Math.random() - .5).slice(0, 4);
    ui.choices.innerHTML = '';
    pool.forEach((u, i) => {
      const button = document.createElement('button'); button.className = 'upgrade-choice';
      button.innerHTML = `<i>${u.icon}</i><b>${i + 1}. ${u.name}</b><span>${u.desc}</span>`;
      button.addEventListener('click', () => chooseUpgrade(u)); ui.choices.appendChild(button);
    });
    ui.upgrade.classList.add('show');
  }

  function chooseUpgrade(upgrade) {
    upgrade.apply(state.player, state); state.takenUpgrades.push(upgrade.id); ui.upgrade.classList.remove('show'); state.mode = 'play';
    burst(state.player.x, state.player.y, '#ffd45f', 28, 230);
    tone(660, .08, 'triangle', .045); tone(880, .14, 'sine', .035, .08);
  }

  function dash() {
    if (!state || state.mode !== 'play') return;
    const p = state.player;
    if (p.dashCd > 0) return;
    p.dash = .26; p.dashCd = p.hasDash ? 2 : 4.2;
    burst(p.x, p.y + 16, '#ffffff', 12, 150); tone(230, .09, 'sawtooth', .025);
  }

  function endGame() {
    if (state.mode === 'end') return;
    state.mode = 'end';
    if (state.player.cargo.length) settleCargo();
    const clean = Math.round(state.cleaned / state.total * 100);
    const clearedEarly = state.cleaned >= state.total && state.time > 0;
    const timeBonus = clearedEarly ? Math.ceil(state.time) : 0;
    state.coins += timeBonus;
    const score = state.coins;
    const best = Math.max(score, Number(localStorage.getItem('dango-cleanup-best') || 0));
    localStorage.setItem('dango-cleanup-best', best);
    ui.finalCoins.textContent = state.coins; ui.timeBonus.textContent = `+${timeBonus}`; ui.finalClean.textContent = clean + '%'; ui.best.textContent = best;
    ui.endTitle.textContent = clean >= 100 ? '甜点街重新亮起来了' : clean >= 75 ? '再跑一圈就能闪闪发亮' : '今天也收拾了不少团子';
    ui.stamp.textContent = clean >= 100 ? '闪亮' : clean >= 75 ? '清爽' : '加油';
    ui.end.classList.add('show'); tone(523, .12, 'triangle', .04); tone(659, .12, 'triangle', .035, .12); tone(784, .2, 'triangle', .03, .24);
  }

  function resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = VIEW.w * dpr; canvas.height = VIEW.h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function render() {
    if (!state) state = createState();
    ctx.save(); ctx.setTransform(canvas.width / VIEW.w, 0, 0, canvas.height / VIEW.h, 0, 0);
    drawBackground();
    ctx.translate(-state.camera.x, -state.camera.y);
    drawWorld();
    ctx.restore();
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, VIEW.h); g.addColorStop(0, '#86dce8'); g.addColorStop(1, '#c9efe2');
    ctx.fillStyle = g; ctx.fillRect(0, 0, VIEW.w, VIEW.h);
  }

  function drawWorld() {
    ctx.fillStyle = '#bde6d2'; roundedRect(0, 0, WORLD.w, WORLD.h, 70); ctx.fill();
    drawRoads();
    state.patches.forEach(drawPatch);
    state.decorations.forEach(drawDecoration);
    drawCart();
    state.motes.forEach(drawMote);
    drawSuction();
    for (let i = state.player.cargo.length - 1; i >= 0; i--) drawCargo(state.player.cargo[i]);
    drawPlayer();
    state.particles.forEach(drawParticle);
    state.texts.forEach(drawFloatingText);
  }

  function drawRoads() {
    ctx.fillStyle = '#f1e9d1'; roundedRect(70, 190, WORLD.w - 140, 260, 90); ctx.fill();
    roundedRect(70, 690, WORLD.w - 140, 260, 90); ctx.fill();
    roundedRect(735, 50, 410, WORLD.h - 100, 100); ctx.fill();
    ctx.strokeStyle = '#ffffff77'; ctx.lineWidth = 5; ctx.setLineDash([24, 26]);
    ctx.beginPath(); ctx.moveTo(110, 320); ctx.lineTo(WORLD.w - 110, 320); ctx.moveTo(110, 820); ctx.lineTo(WORLD.w - 110, 820); ctx.stroke(); ctx.setLineDash([]);
    ctx.globalAlpha = .14; ctx.fillStyle = '#385473';
    for (let x = 130; x < WORLD.w; x += 95) for (let y = 100; y < WORLD.h; y += 90) { ctx.beginPath(); ctx.arc(x + (y % 180 ? 20 : 0), y, 2, 0, Math.PI * 2); ctx.fill(); }
    ctx.globalAlpha = 1;
  }

  function drawPatch(patch) {
    const ratio = patch.remain / patch.initial;
    if (ratio <= 0) return;
    ctx.save(); ctx.globalAlpha = .12 + ratio * .18; ctx.fillStyle = '#7b6c82';
    for (let i = 0; i < 12; i++) { const a = i * 2.399, r = patch.r * (.22 + (i % 5) * .13) * ratio; ctx.beginPath(); ctx.arc(patch.x + Math.cos(a) * r * .55, patch.y + Math.sin(a) * r * .42, 24 + (i % 4) * 10, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  }

  function drawDecoration(d) {
    ctx.save(); ctx.translate(d.x, d.y); ctx.scale(d.s, d.s);
    if (d.kind === 'tree') {
      ctx.fillStyle = '#60465d'; roundedRect(-8, 12, 16, 38, 7); ctx.fill();
      ctx.fillStyle = '#5bb788'; blob(0, 0, 39); ctx.fill(); ctx.fillStyle = '#8ed39e'; blob(-10, -12, 24); ctx.fill();
    } else {
      ctx.fillStyle = '#596585'; roundedRect(-4, -25, 8, 66, 3); ctx.fill();
      ctx.fillStyle = '#ffd45f'; ctx.beginPath(); ctx.arc(0, -28, 12, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff6b8'; ctx.lineWidth = 5; ctx.globalAlpha = .25; ctx.beginPath(); ctx.arc(0, -28, 23, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  }

  function drawCart() {
    const c = state.cart;
    ctx.save(); ctx.translate(c.x, c.y);
    ctx.globalAlpha = .22; ctx.fillStyle = '#26315f'; ctx.beginPath(); ctx.ellipse(0, 64, 112, 31, 0, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
    ctx.fillStyle = '#fffdf2'; ctx.strokeStyle = '#26315f'; ctx.lineWidth = 5; roundedRect(-98, -50, 196, 118, 23); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#f47f9e'; roundedRect(-105, -76, 210, 42, 18); ctx.fill(); ctx.stroke();
    for (let i = 0; i < 5; i++) { ctx.fillStyle = i % 2 ? '#fffdf2' : '#f47f9e'; ctx.beginPath(); ctx.moveTo(-100 + i * 42, -37); ctx.lineTo(-80 + i * 42, -37); ctx.lineTo(-90 + i * 42, -76); ctx.lineTo(-110 + i * 42, -76); ctx.closePath(); ctx.fill(); }
    ctx.fillStyle = '#73d7e8'; roundedRect(-64, -17, 128, 45, 12); ctx.fill(); ctx.fillStyle = '#26315f'; ctx.font = '900 17px Microsoft YaHei'; ctx.textAlign = 'center'; ctx.fillText('团子回收餐车', 0, 12);
    ctx.fillStyle = '#26315f'; ctx.beginPath(); ctx.arc(-61, 69, 17, 0, Math.PI * 2); ctx.arc(61, 69, 17, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#ffd45f'; ctx.lineWidth = 5; ctx.globalAlpha = .5 + Math.sin(performance.now() / 250) * .12; ctx.beginPath(); ctx.arc(0, 0, 124, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  function drawSuction() {
    if (state.mode !== 'play') return;
    const p = state.player;
    ctx.save(); ctx.strokeStyle = '#ffffff'; ctx.globalAlpha = .12; ctx.lineWidth = 3; ctx.setLineDash([8, 12]); ctx.beginPath(); ctx.arc(p.x, p.y, p.suction, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  }

  function drawMote(m) {
    ctx.save(); ctx.translate(m.x, m.y + Math.sin(m.phase) * 3); ctx.rotate(Math.sin(m.phase * .7) * .08);
    ctx.globalAlpha = .18; ctx.fillStyle = '#26315f'; ctx.beginPath(); ctx.ellipse(0, m.size + 7, m.size * .9, 6, 0, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
    drawDangoShape(m.type, 1, m.size); ctx.restore();
  }

  function drawCargo(c) {
    ctx.save(); ctx.translate(c.x, c.y + Math.sin(c.wobble) * 2); const size = 15 + Math.min(c.level, 4) * 6 + Math.max(0, c.level - 4) * 3;
    ctx.globalAlpha = .18; ctx.fillStyle = '#26315f'; ctx.beginPath(); ctx.ellipse(0, size + 8, size * .9, 7, 0, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
    drawDangoShape(c.type, c.level, size); ctx.restore();
  }

  function drawDangoShape(type, level, size) {
    ctx.fillStyle = COLORS[type]; ctx.strokeStyle = '#26315f'; ctx.lineWidth = Math.max(2.5, size * .13);
    blob(0, 0, size); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#26315f'; ctx.beginPath(); ctx.arc(-size * .27, -1, size * .08, 0, Math.PI * 2); ctx.arc(size * .27, -1, size * .08, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, size * .08, size * .18, .1, Math.PI - .1); ctx.stroke();
    if (level > 1) { ctx.fillStyle = '#fffdf2'; ctx.font = `900 ${Math.max(10, size * .42)}px Arial`; ctx.textAlign = 'center'; ctx.fillText(level, 0, -size - 5); }
    ctx.fillStyle = '#ffffff66'; ctx.beginPath(); ctx.arc(-size * .3, -size * .34, size * .19, 0, Math.PI * 2); ctx.fill();
  }

  function drawPlayer() {
    const p = state.player, moving = input.keys.size || input.pointer;
    ctx.save(); ctx.translate(p.x, p.y + (moving ? Math.sin(p.bob) * 2 : 0)); ctx.scale(p.facing, 1);
    ctx.globalAlpha = .2; ctx.fillStyle = '#26315f'; ctx.beginPath(); ctx.ellipse(0, 29, 29, 10, 0, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
    ctx.fillStyle = '#26315f'; roundedRect(-20, 4, 40, 31, 14); ctx.fill();
    ctx.fillStyle = '#fffdf2'; ctx.beginPath(); ctx.arc(0, -13, 24, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#26315f'; ctx.lineWidth = 5; ctx.stroke();
    ctx.fillStyle = '#ffd45f'; ctx.beginPath(); ctx.moveTo(-25, -16); ctx.quadraticCurveTo(0, -48, 27, -17); ctx.quadraticCurveTo(8, -23, -25, -16); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#26315f'; ctx.beginPath(); ctx.arc(-7, -11, 2.6, 0, Math.PI * 2); ctx.arc(8, -11, 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#26315f'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(1, -5, 7, .25, Math.PI - .25); ctx.stroke();
    ctx.fillStyle = '#f47f9e'; ctx.beginPath(); ctx.arc(-15, -3, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#73d7e8'; roundedRect(16, 5, 21, 25, 7); ctx.fill(); ctx.strokeStyle = '#26315f'; ctx.lineWidth = 4; ctx.stroke();
    ctx.restore();
  }

  function drawParticle(p) { ctx.save(); ctx.globalAlpha = clamp(p.life / p.max, 0, 1); ctx.fillStyle = p.color; ctx.translate(p.x, p.y); ctx.rotate(p.life * 8); roundedRect(-p.size / 2, -p.size / 2, p.size, p.size, 2); ctx.fill(); ctx.restore(); }
  function drawFloatingText(t) { ctx.save(); ctx.globalAlpha = clamp(t.life / .35, 0, 1); ctx.font = `900 ${t.size}px Microsoft YaHei`; ctx.textAlign = 'center'; ctx.lineWidth = 5; ctx.strokeStyle = '#fffdf2'; ctx.strokeText(t.text, t.x, t.y); ctx.fillStyle = t.color; ctx.fillText(t.text, t.x, t.y); ctx.restore(); }

  function blob(x, y, r) {
    ctx.beginPath();
    for (let i = 0; i <= 12; i++) { const a = i / 12 * Math.PI * 2, rr = r * (1 + Math.sin(i * 5.17) * .055); const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
    ctx.closePath();
  }
  function roundedRect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

  function updateHud() {
    if (!state) return;
    const clean = Math.round(state.cleaned / state.total * 100);
    ui.cleanText.textContent = clean + '%'; ui.cleanBar.style.width = clean + '%'; ui.coins.textContent = state.coins;
    const seconds = Math.ceil(state.time); ui.clock.textContent = `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;
    ui.clock.parentElement.classList.toggle('danger', seconds <= 15);
    ui.combo.classList.toggle('show', state.combo >= 2 && state.comboTimer > 0);
    ui.prompt.classList.toggle('show', state.player.cargo.length >= state.player.capacity);
  }

  function frame(now) {
    const dt = Math.min(.033, (now - last) / 1000); last = now;
    update(dt); render(); updateHud(); requestAnimationFrame(frame);
  }

  function pointerToWorld(event) {
    const r = canvas.getBoundingClientRect();
    return { x: (event.clientX - r.left) / r.width * VIEW.w + state.camera.x, y: (event.clientY - r.top) / r.height * VIEW.h + state.camera.y };
  }

  window.addEventListener('keydown', e => {
    const key = e.key.toLowerCase();
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' ', 'w', 'a', 's', 'd'].includes(key)) e.preventDefault();
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'w', 'a', 's', 'd'].includes(key)) input.target = null;
    input.keys.add(key);
    if (key === ' ') dash();
    if (state?.mode === 'upgrade' && ['1', '2', '3', '4'].includes(key)) ui.choices.children[Number(key) - 1]?.click();
  });
  window.addEventListener('keyup', e => input.keys.delete(e.key.toLowerCase()));
  canvas.addEventListener('pointerdown', e => { input.pointer = true; input.target = pointerToWorld(e); canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', e => { if (input.pointer) input.target = pointerToWorld(e); });
  canvas.addEventListener('pointerup', () => { input.pointer = false; });
  canvas.addEventListener('pointercancel', () => { input.pointer = false; });
  document.getElementById('startButton').addEventListener('click', startGame);
  document.getElementById('restartButton').addEventListener('click', startGame);
  ui.sound.addEventListener('click', () => { audioOn = !audioOn; ui.sound.classList.toggle('off', !audioOn); if (audioOn) { ensureAudio(); tone(660); } });
  window.addEventListener('resize', resize);

  resize(); state = createState(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
